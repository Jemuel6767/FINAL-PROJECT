$kind: http-request
url: "{{base_url}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "student@example.com",
      "password": "Student123!"
    }
scripts:
  - type: afterResponse
    code: if (pm.response.code === 200) pm.collectionVariables.set('student_token', pm.response.json().access_token);
    language: text/javascript
order: 2000
